[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhs-intelligence-mcp"
version = "0.1.0"
description = "MCP server exposing NHS waiting-time and trust-intelligence tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2,<2",
    "openpyxl>=3.1.5",
    "platformdirs>=4.11.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
nhs-intel-mcp = "nhs_intel.server:main"
nhs-intel-load-db = "nhs_intel.ingest.load_db:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
