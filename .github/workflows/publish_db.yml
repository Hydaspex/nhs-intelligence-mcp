name: Publish nhs_intel.db

on:
  schedule:
    - cron: "0 2 * * 0"   # Sunday 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout nhs-intelligence-mcp
        uses: actions/checkout@v4

      - name: Checkout nhs-webscraper
        uses: actions/checkout@v4
        with:
          repository: Hydaspex/nhs-webscraper
          token: ${{ secrets.WEBSCRAPER_READ_TOKEN }}
          path: _webscraper

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install webscraper deps
        working-directory: _webscraper
        run: uv sync --extra crawl

      - name: Install Playwright chromium
        working-directory: _webscraper
        run: .venv/bin/python -m playwright install chromium --with-deps

      - name: Install MCP server deps
        run: uv sync --extra crawl

      - name: Install Playwright chromium (for WAF-gated RTT index)
        run: uv run playwright install chromium --with-deps

      # ------------------------------------------------------------------
      # Seed from the previous release so RTT history accrues across runs.
      # A fresh checkout has no DB; each build starts from the last one and
      # only adds the months it is missing. First-ever run seeds from empty.
      # ------------------------------------------------------------------
      - name: Seed from previous release DB
        run: |
          if gh release download --pattern nhs_intel.db --dir . 2>/dev/null; then
            echo "seeded from previous release"
          else
            echo "no previous release; starting from empty DB"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # Scrape NHS My Planned Care
      # ------------------------------------------------------------------
      - name: Scrape My Planned Care
        working-directory: _webscraper
        run: |
          .venv/bin/python -m nhs_scraper.cli \
            --discover \
            --limit 50 \
            --max-depth 1 \
            --concurrency 2 \
            --output /tmp/planned_care.csv

      # ------------------------------------------------------------------
      # Download CQC ratings
      # ------------------------------------------------------------------
      - name: Download CQC ratings
        id: cqc_download
        run: |
          uv run python -m nhs_intel.ingest.cqc_ingest --out /tmp/cqc_ratings.csv \
          && echo "available=true" >> "$GITHUB_OUTPUT" \
          || echo "available=false" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # Load the always-current sources into the seeded DB. This also creates
      # the schema, so the RTT backfill below can insert into an existing table.
      # ------------------------------------------------------------------
      - name: Load DB (planned care + CQC)
        run: |
          CQC_ARG=""
          if [ "${{ steps.cqc_download.outputs.available }}" = "true" ]; then
            CQC_ARG="--cqc /tmp/cqc_ratings.csv"
          fi
          uv run nhs-intel-load-db \
            --planned-care /tmp/planned_care.csv \
            $CQC_ARG \
            --db nhs_intel.db

      # ------------------------------------------------------------------
      # Incrementally add any recent RTT months the seeded DB is missing.
      # NHS England's index is behind AWS WAF, so this drives a real browser.
      # Reconciling a window (not just the latest month) also self-heals a
      # missed run. A run that adds nothing is not fatal — the DB stays valid.
      # ------------------------------------------------------------------
      - name: Backfill missing RTT months
        run: |
          uv run nhs-intel-rtt-backfill \
            --db nhs_intel.db \
            --window 6 \
            --xlsx-cache /tmp/rtt_backfill \
          || echo "RTT backfill added no new months this run"

      # ------------------------------------------------------------------
      # Compute SHA-256 checksum
      # ------------------------------------------------------------------
      - name: Compute SHA-256
        run: sha256sum nhs_intel.db > nhs_intel.db.sha256

      # ------------------------------------------------------------------
      # Publish as a GitHub release
      # ------------------------------------------------------------------
      - name: Determine release tag
        id: tag
        run: echo "name=data-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Summarise RTT coverage
        id: rtt_coverage
        run: |
          months=$(uv run python -c "import sqlite3,sys; \
          rows=sqlite3.connect('nhs_intel.db').execute('SELECT DISTINCT as_of FROM rtt ORDER BY as_of').fetchall(); \
          print(', '.join(r[0][:7] for r in rows) or 'none')")
          echo "months=$months" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "NHS Intelligence DB — ${{ steps.tag.outputs.name }}"
          body: |
            Automated weekly build of `nhs_intel.db`.

            Sources:
            - NHS My Planned Care scrape (all trusts, concurrency 2)
            - NHS England RTT Incomplete Provider (months: ${{ steps.rtt_coverage.outputs.months }})

            SHA-256: see `nhs_intel.db.sha256`
          files: |
            nhs_intel.db
            nhs_intel.db.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
